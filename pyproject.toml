[tool.uv.workspace]
members = ["packages/meridian-partition"]

# uv only honors these settings in the workspace root; they apply to every member.
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]
constraint-dependencies = [
    # Temporary pin for Azure public-container ingest regression in adlfs 2026.4.0 stack
    "adlfs==2026.2.0",
    # deltalake 1.3.0 is missing Linux ARM64 wheels, causing Docker ARM64 builds to fail
    "deltalake<1.3.0",
    "fonttools>=4.60.2",
    "protobuf>=6.30.0",
    "pykx>=3.1.6",  # 3.1.2 is missing macOS wheels (transitive dep of kdbai-client)
    "tokenizers>=0.21",
    "urllib3>=2.0.0",
    "weaviate-client>=4.20.1",
]
